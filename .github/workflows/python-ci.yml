name: python CI
on:
  push:
     branches: [main]
      pull_request:
        branches:[ main ]
      jobs:
      ci:
         run-on: ubuntu-latest
         steps:
             - name: Checkout code
               uses: actions/checkout@v4
             - name: set up python
               uses: actions/setup-python@v4
               with:
               python-version: "3.12"
               cache: "pip"
             - name: Install dependencies
               run:
                   python -m pip install --upgrade pip
                   pip install -r requirement.txt
             - name: Link with flakes
               run: flakes src texts --max-line-length=100
             - name:Run tests
                run: pytext --junitxml=results.xml -v
             - name: Upload test results
               if: always()
               uses: actions/upload-artifact@v4
               with:
                name: app-package
                path: src/          
